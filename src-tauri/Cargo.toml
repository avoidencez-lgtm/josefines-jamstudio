[package]
name = "src-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
base64 = "0.22"
tauri-plugin-log = "2"
jam-core.workspace = true
jam-dsp.workspace = true
jam-audio.workspace = true
jam-band.workspace = true
jam-rig.workspace = true
keyring.workspace = true
rusqlite.workspace = true
dirs = "6.0"
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true

[dev-dependencies]
# Mock runtime for tests/ipc_e2e.rs; feature unification keeps it out of release builds.
tauri = { version = "2.11", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
