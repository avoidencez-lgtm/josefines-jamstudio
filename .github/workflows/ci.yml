name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: markdown links (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}" "**/*.md"
          fail: true

  ts:
    name: ts (lint, types, test, licenses, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test REAPER import script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          lua5.4 tests/reaper-import.lua
      - run: pnpm licenses:check
      - run: pnpm build

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (headless)
        run: cargo test --workspace
        env:
          JAM_HEADLESS: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Compile Windows desktop with embedded frontend
        if: runner.os == 'Windows'
        run: pnpm tauri build --debug --no-bundle
      - name: Smoke-run the Windows app headless (frontend handshake)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JAM_HEADLESS: "1"
          JAM_SMOKE_SECONDS: "25"
          JAM_USER_DIR: ${{ runner.temp }}\jam-smoke
        run: |
          $exe = Get-ChildItem target\debug -Filter *.exe | Where-Object { $_.Name -match 'Josefines Jamstudio|src-tauri' } | Select-Object -First 1
          if (-not $exe) { throw "app binary not found under target/debug" }
          Write-Host "running $($exe.FullName)"
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "smoke run exited with $LASTEXITCODE" }
      - name: Build Mac app and verify recording privacy metadata
        if: runner.os == 'macOS'
        run: |
          pnpm tauri build --debug --bundles app
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "target/debug/bundle/macos/Josefines Jamstudio.app/Contents/Info.plist"
      - name: Smoke-run the Mac app headless (frontend handshake)
        if: runner.os == 'macOS'
        env:
          JAM_HEADLESS: "1"
          JAM_SMOKE_SECONDS: "25"
          JAM_USER_DIR: ${{ runner.temp }}/jam-smoke
        run: |
          bin=$(ls "target/debug/bundle/macos/Josefines Jamstudio.app/Contents/MacOS/"* | head -1)
          echo "running $bin"
          "$bin"
      - name: License and advisory check (cargo deny)
        run: cargo deny check
