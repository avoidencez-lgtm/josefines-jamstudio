name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: markdown links (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}" "**/*.md"
          fail: true

  ts:
    name: ts (lint, types, test, licenses, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test REAPER import script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          lua5.4 tests/reaper-import.lua
      - run: pnpm licenses:check
      - run: pnpm build

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-deny
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-deny
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (headless)
        run: cargo test --workspace --locked
        env:
          JAM_HEADLESS: "1"
      - name: Format S4 protocol probe
        run: cargo fmt --manifest-path scripts/spikes/lyria-ws/Cargo.toml -- --check
      - name: Clippy S4 protocol probe
        run: cargo clippy --manifest-path scripts/spikes/lyria-ws/Cargo.toml --locked --bin jam-lyria-probe -- -D warnings
      - name: Test S4 loopback (no provider access)
        run: cargo test --manifest-path scripts/spikes/lyria-ws/Cargo.toml --locked -- --nocapture
        env:
          JAM_HEADLESS: "1"
          JAM_LIVE: "0"
      - name: Audit S4 probe dependencies
        run: cargo deny --manifest-path scripts/spikes/lyria-ws/Cargo.toml --config deny.toml check
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:check
      - run: pnpm test
      - name: Compile Windows desktop with embedded frontend
        if: runner.os == 'Windows'
        run: pnpm tauri build --debug --no-bundle
      - name: Smoke-run the Windows app headless (frontend handshake)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JAM_HEADLESS: "1"
          JAM_SMOKE_SECONDS: "25"
          JAM_USER_DIR: ${{ runner.temp }}\jam-smoke
        run: |
          $exe = Get-ChildItem target\debug -Filter *.exe | Where-Object { $_.Name -match 'Josefines Jamstudio|src-tauri' } | Select-Object -First 1
          if (-not $exe) { throw "app binary not found under target/debug" }
          Write-Host "running $($exe.FullName)"
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "smoke run exited with $LASTEXITCODE" }
      - name: Build Mac app and verify recording privacy metadata
        if: runner.os == 'macOS'
        run: |
          pnpm tauri build --debug --bundles app
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "target/debug/bundle/macos/Josefines Jamstudio.app/Contents/Info.plist"
      - name: Smoke-run the Mac app headless (frontend handshake)
        if: runner.os == 'macOS'
        env:
          JAM_HEADLESS: "1"
          JAM_SMOKE_SECONDS: "25"
          JAM_USER_DIR: ${{ runner.temp }}/jam-smoke
        run: |
          bin=$(ls "target/debug/bundle/macos/Josefines Jamstudio.app/Contents/MacOS/"* | head -1)
          echo "running $bin"
          "$bin"
      - name: License and advisory check (cargo deny)
        run: cargo deny check

  msrv:
    name: rust (MSRV 1.88)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --locked
