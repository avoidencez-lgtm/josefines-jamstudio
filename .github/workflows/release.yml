name: release

# Builds installers when a version tag is pushed (v0.1.0, v0.2.0-rc1, ...) and attaches
# them to a draft GitHub Release for the owner to check and publish.
#
# Not set up yet: Apple code signing and notarisation, Windows Authenticode. Until those
# secrets exist the bundles are unsigned, so first launch needs the usual right-click
# Open (macOS) or "More info, run anyway" (Windows) step. The status board records this.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: require green main CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful main CI for the tag commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          success=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci --event push --status success --limit 1 --json databaseId --jq 'length == 1')
          test "$success" = "true"

  build:
    name: bundle (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      - name: Build preview installers
        if: github.event_name == 'workflow_dispatch'
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload preview installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jamstudio-${{ matrix.name }}
          path: |
            target/**/bundle/**/*.dmg
            target/**/bundle/**/*.msi
            target/**/bundle/**/*.exe
          if-no-files-found: error

      - name: Build and upload bundles
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Josefines Jamstudio ${{ github.ref_name }}"
          releaseBody: |
            Unsigned preview build. See the README for supported workflows and pending owner checks.
            macOS: right-click the app and choose Open the first time. Windows: choose "More info", then "Run anyway".
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  checksums:
    name: release checksums
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release assets and create SHA-256 sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          rm -f release-assets/SHA256SUMS.txt
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum > ../SHA256SUMS.txt
          test -s ../SHA256SUMS.txt
      - name: Attach SHA-256 sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
