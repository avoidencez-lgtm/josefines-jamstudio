[package]
name = "jam-lyria-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

# S4 helper, deliberately outside the application dependency graph.
[workspace]

# Reuse SecretStore directly. Its application-dependent tests run in the root workspace.
[lib]
name = "jam_probe_keys"
path = "../../../src-tauri/src/keys.rs"
test = false
doctest = false

[dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", features = ["sink"] }
serde_json = "1"
base64 = "0.22"
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }
hound = "3.5"
