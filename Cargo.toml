[workspace]
resolver = "2"
members = [
    "crates/jam-core",
    "crates/jam-dsp",
    "crates/jam-audio",
    "crates/jam-band",
    "crates/jam-rig",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vegar <avoidencez@gmail.com>"]
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
jam-core = { path = "crates/jam-core" }
jam-dsp = { path = "crates/jam-dsp" }
jam-audio = { path = "crates/jam-audio" }
jam-band = { path = "crates/jam-band" }
jam-rig = { path = "crates/jam-rig" }

# Audio & DSP
cpal = "0.15"
rtrb = "0.3"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "flac", "pcm"] }
rubato = "0.16"
rustysynth = "1.3"
pitch-detection = "0.3"
rustfft = "6.2"

# MIDI
midir = "0.10"
midly = "0.5"

# Systems, Async & Persistence
keyring = { version = "3.6", features = ["windows-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
parking_lot = "0.12"
thiserror = "2.0"
tracing = "0.1"

# Serialization & Seams
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
include_dir = "0.7"
rand = "0.8"
rand_pcg = "0.3"
cxx = "1.0"
