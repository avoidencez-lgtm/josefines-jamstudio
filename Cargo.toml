[workspace]
resolver = "2"
members = [
    "crates/jam-core",
    "crates/jam-dsp",
    "crates/jam-audio",
    "crates/jam-band",
    "crates/jam-rig",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vegar <avoidencez@gmail.com>"]
license = "Apache-2.0"

[workspace.dependencies]
jam-core = { path = "crates/jam-core" }
jam-dsp = { path = "crates/jam-dsp" }
jam-audio = { path = "crates/jam-audio" }
jam-band = { path = "crates/jam-band" }
jam-rig = { path = "crates/jam-rig" }

cpal = "0.15"
rtrb = "0.3"
hound = "3.5"
pitch-detection = "0.3"

keyring = { version = "3.6", features = ["windows-native"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_pcg = "0.3"
